<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} | {{ .Site.Title }}</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #fbfaf8;
            font-family: Spectral, Georgia, serif;
            color: #3f3b35;
        }

        a {
            color: #7d2231;
            text-decoration: none;
        }

        a:hover {
            color: #5a1622;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 44px;
            border-bottom: 1px solid #e2ded6;
            background: #fbfaf8;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-img {
            width: 60px;
            height: auto;
        }

        .logo-text h1 {
            font: 600 17px/1 Spectral, serif;
            color: #1c1a17;
            margin: 0;
            letter-spacing: 0.01em;
        }

        .logo-text .subtitle {
            font: 500 9.5px/1 'JetBrains Mono', monospace;
            letter-spacing: 0.14em;
            color: #6b665e;
        }

        nav {
            display: flex;
            gap: 30px;
            font: 400 14px/1 Spectral, serif;
            color: #3f3b35;
        }

        nav a {
            position: relative;
            padding-bottom: 3px;
        }

        nav a.active {
            color: #7d2231;
            border-bottom: 1.5px solid #7d2231;
        }

        nav a:not(.active):hover {
            color: #5a1622;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            background: #fbfaf8;
        }

        footer {
            padding: 26px 44px;
            border-top: 1px solid #e2ded6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font: 400 13px Spectral, serif;
            color: #6b665e;
            background: #fbfaf8;
        }

        footer a {
            color: #6b665e;
        }

        .footer-links {
            font: 400 11px 'JetBrains Mono', monospace;
            letter-spacing: 0.08em;
        }

        .footer-links a {
            margin-left: 12px;
        }

        h1 {
            font: 300 46px/1.12 Spectral, serif;
            color: #1c1a17;
            letter-spacing: -0.015em;
            text-wrap: pretty;
            margin-bottom: 20px;
        }

        h2 {
            font: 600 13px/1 'JetBrains Mono', monospace;
            letter-spacing: 0.14em;
            color: #1c1a17;
            margin: 28px 0 16px 0;
            text-transform: uppercase;
        }

        h3 {
            font: 400 22px/1.25 Spectral, serif;
            color: #1c1a17;
            text-wrap: pretty;
            margin-bottom: 12px;
        }

        p {
            font: 400 16px/1.6 Spectral, serif;
            color: #4a463f;
            margin-bottom: 16px;
            max-width: 65ch;
            text-wrap: pretty;
        }

        .issue-header {
            font: 500 10.5px/1 'JetBrains Mono', monospace;
            letter-spacing: 0.14em;
            color: #7d2231;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .reading-time {
            font: 500 11px/1 'JetBrains Mono', monospace;
            color: #6b665e;
        }

        .button {
            display: inline-block;
            background: #7d2231;
            color: #fff;
            padding: 12px 22px;
            font: 500 11px/1.5 'JetBrains Mono', monospace;
            letter-spacing: 0.1em;
            border: none;
            cursor: pointer;
            text-decoration: none;
            margin-top: 12px;
        }

        .button:hover {
            background: #5a1622;
        }

        .container {
            padding: 52px 44px 40px;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 56px;
            align-items: start;
        }

        .sidebar-box {
            border: 1px solid #ded9d1;
            background: #f5f2ec;
        }

        .sidebar-header {
            padding: 14px 18px;
            border-bottom: 1px solid #ded9d1;
            font: 500 10px/1 'JetBrains Mono', monospace;
            letter-spacing: 0.14em;
            color: #6b665e;
        }

        .sidebar-row {
            display: flex;
            justify-content: space-between;
            padding: 13px 18px;
            border-bottom: 1px solid #e6e1d9;
            font: 400 14px Spectral, serif;
            color: #3f3b35;
        }

        .sidebar-row:last-child {
            border-bottom: none;
        }

        .sidebar-row .value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
        }

        .card {
            background: #fbfaf8;
            padding: 26px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-bottom: 1px solid #e2ded6;
        }

        .card:last-child {
            border-bottom: none;
        }

        .card-tag {
            font: 500 10px/1 'JetBrains Mono', monospace;
            letter-spacing: 0.14em;
            color: #7d2231;
            text-transform: uppercase;
        }

        .card-title {
            font: 400 22px/1.25 Spectral, serif;
            color: #1c1a17;
            text-wrap: pretty;
            margin: 0;
        }

        .card-text {
            font: 400 15px/1.55 Spectral, serif;
            color: #57534c;
            margin: 0;
        }

        .tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            padding-top: 4px;
        }

        .tag {
            font: 400 10.5px/1 'JetBrains Mono', monospace;
            color: #6b665e;
            border: 1px solid #ded9d1;
            padding: 5px 8px;
        }

        /* Article (single issue) layout */

        .article-header {
            padding: 56px 56px 40px;
            border-bottom: 1px solid #e2ded6;
        }

        .article-header-inner {
            max-width: 820px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .article-badge-row {
            display: flex;
            gap: 14px;
            align-items: center;
            font: 500 10.5px/1 'JetBrains Mono', monospace;
            letter-spacing: 0.14em;
            color: #7d2231;
            text-transform: uppercase;
        }

        .article-badge-row .sep {
            color: #c9bfb4;
        }

        .article-header h1 {
            margin: 0;
            font: 300 50px/1.1 Spectral, serif;
            letter-spacing: -0.02em;
        }

        .article-dek {
            margin: 0;
            font: 400 19px/1.55 Spectral, serif;
            color: #4a463f;
            max-width: 64ch;
        }

        .article-info-grid {
            margin-top: 34px;
            padding-top: 22px;
            border-top: 1px solid #e2ded6;
            display: grid;
            grid-template-columns: repeat(3, auto) 1fr;
            gap: 44px;
            max-width: 1000px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .info-label {
            font: 500 9.5px/1 'JetBrains Mono', monospace;
            letter-spacing: 0.14em;
            color: #6b665e;
        }

        .info-value {
            font: 400 15px Spectral, serif;
            color: #1c1a17;
        }

        .info-item-wide .info-value {
            font: 400 14px/1.5 Spectral, serif;
            color: #57534c;
        }

        .article-layout {
            display: grid;
            grid-template-columns: 236px 1fr;
        }

        .article-sidebar {
            border-right: 1px solid #e2ded6;
            padding: 36px 24px;
            display: flex;
            flex-direction: column;
            gap: 26px;
            align-self: start;
            position: sticky;
            top: 0;
        }

        .sidebar-label {
            font: 500 9.5px/1 'JetBrains Mono', monospace;
            letter-spacing: 0.14em;
            color: #6b665e;
            margin-bottom: 11px;
        }

        .sidebar-divider {
            height: 1px;
            background: #e2ded6;
        }

        #TableOfContents,
        #TableOfContents ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        #TableOfContents ul {
            margin-top: 6px;
            margin-left: 12px;
        }

        #TableOfContents a {
            font: 400 14px/1.35 Spectral, serif;
            color: #3f3b35;
            text-decoration: none;
        }

        #TableOfContents a:hover,
        #TableOfContents a.active {
            color: #7d2231;
        }

        .hunt-priorities-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font: 400 13px/1.4 Spectral, serif;
            color: #57534c;
        }

        .article-body {
            padding: 36px 56px 56px;
            display: flex;
            flex-direction: column;
            gap: 44px;
            max-width: 860px;
        }

        .article-body h2 {
            font: 600 12px/1 'JetBrains Mono', monospace;
            letter-spacing: 0.16em;
            color: #1c1a17;
            padding-bottom: 12px;
            border-bottom: 1px solid #e2ded6;
            margin: 0 0 16px;
            scroll-margin-top: 20px;
        }

        .article-body h3 {
            font: 300 26px/1.28 Spectral, serif;
            color: #1c1a17;
            margin: 10px 0 0;
        }

        .article-body p {
            font: 400 17px/1.68 Spectral, serif;
            color: #3f3b35;
            max-width: none;
        }

        .article-body ul,
        .article-body ol {
            font: 400 17px/1.68 Spectral, serif;
            color: #3f3b35;
            padding-left: 22px;
        }

        .article-body li {
            margin-bottom: 10px;
        }

        .classification-box {
            border: 1px solid #ded9d1;
            background: #f5f2ec;
            padding: 22px 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .classification-rows {
            display: flex;
            flex-direction: column;
            gap: 10px;
            font: 400 14px/1.5 Spectral, serif;
            color: #3f3b35;
        }

        .classification-row {
            display: flex;
            gap: 12px;
            align-items: baseline;
        }

        .tag-badge {
            flex: 0 0 auto;
            display: inline-block;
            width: 44px;
            text-align: center;
            font: 500 10px/1 'JetBrains Mono', monospace;
            padding: 4px 0;
            margin-right: 5px;
        }

        p .tag-badge {
            padding: 3px 5px;
            width: auto;
        }

        .tag-am { background: #e4e0d6; color: #4a463f; }
        .tag-ix { background: #d7dee2; color: #2f4450; }
        .tag-gt { background: #e8dcc6; color: #5c4718; }
        .tag-sp { background: #ecd7dc; color: #7d2231; }

        .hunt-priority {
            border-left: 3px solid #7d2231;
            background: #f5f2ec;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin: 6px 0;
        }

        .hunt-priority-header {
            font: 400 13px/1.6 'JetBrains Mono', monospace;
            color: #1c1a17;
        }

        .hunt-priority-header strong {
            font-weight: 500;
            color: #7d2231;
            display: block;
        }

        .hunt-priority p {
            margin: 0;
            font: 400 16px/1.65 Spectral, serif;
        }

        .article-table-wrap {
            overflow-x: auto;
        }

        .article-table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #e2ded6;
            font-size: 14px;
        }

        .article-table th {
            background: #f5f2ec;
            padding: 11px 12px;
            font: 500 9.5px/1.3 'JetBrains Mono', monospace;
            letter-spacing: 0.1em;
            color: #3f3b35;
            text-align: left;
            border-bottom: 1px solid #e2ded6;
        }

        .article-table td {
            background: #fbfaf8;
            padding: 14px 12px;
            font: 400 15px/1.55 Spectral, serif;
            color: #1c1a17;
            border-top: 1px solid #e2ded6;
            vertical-align: top;
        }

        .article-disclaimer {
            margin: 0 56px 48px;
            padding-top: 26px;
            border-top: 1px solid #e2ded6;
            font: italic 400 14.5px/1.6 Spectral, serif;
            color: #6b665e;
            text-align: center;
            max-width: 70ch;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 20px;
            }

            nav {
                flex-direction: column;
                gap: 12px;
            }

            .content {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 32px;
            }

            p {
                font-size: 15px;
            }

            .article-header,
            .article-body {
                padding-left: 24px;
                padding-right: 24px;
            }

            .article-header h1 {
                font-size: 34px;
            }

            .article-info-grid {
                grid-template-columns: 1fr 1fr;
            }

            .article-layout {
                grid-template-columns: 1fr;
            }

            .article-sidebar {
                position: static;
                border-right: none;
                border-bottom: 1px solid #e2ded6;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-section">
            <img src="/images/logo.png" alt="Knights Who Say Ni" class="logo-img">
            <div class="logo-text">
                <h1>{{ .Site.Title }}</h1>
                <div class="subtitle">{{ .Site.Params.subtitle }}</div>
            </div>
        </div>
        <nav>
            {{ range .Site.Menus.main }}
            <a href="{{ .URL }}" {{ if eq .URL $.RelPermalink }}class="active"{{ end }}>{{ .Name }}</a>
            {{ end }}
        </nav>
    </header>

    <main>
        {{ block "main" . }}{{ end }}
    </main>

    <footer>
        <span>{{ .Site.Title }} · Written and maintained by {{ .Site.Params.author }}</span>
        <div class="footer-links">
            <span>RSS</span>
            <span>·</span>
            <a href="https://github.com/{{ .Site.Params.github }}">GITHUB</a>
            <span>·</span>
            <span>CONTACT</span>
        </div>
    </footer>
</body>
</html>

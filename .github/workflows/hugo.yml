name: Hugo Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync-evidence:
    # Rebuilds the source registry from data/citations/ and runs
    # incremental evidence capture, then commits the result back to the
    # PR branch. Runs on every PR, not just ones that touch citations --
    # both scripts are cheap no-ops when nothing changed (build_registry
    # is a single in-memory pass; capture_evidence makes zero network
    # calls when every cited URL already has a manifest entry), so
    # unconditional is simpler than path-filtering and never slows down
    # an unrelated PR. Skipped entirely on a fork PR: GITHUB_TOKEN can't
    # push to a fork's branch, so there's nothing this job could do there.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Rebuild source registry from citations
        run: python3 scripts/build_registry.py
      - name: Incremental evidence capture (only fetches genuinely new URLs)
        run: python3 scripts/capture_evidence.py
      - name: Validate data layer
        run: python3 scripts/validate_data.py
      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/)" ]; then
            git add data/
            git commit -m "Auto-sync source registry and evidence manifests [skip ci]"
            git push origin HEAD:"${{ github.head_ref }}"
          else
            echo "no changes to commit"
          fi

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate_data.py

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: latest
      - run: hugo --minify
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'push'
        with:
          path: ./public

  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
